name: Package and platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      # The default build creates an sdist, then builds the wheel FROM that sdist.
      - run: python -m build --outdir dist/pypi
      - run: python -m twine check --strict dist/pypi/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/pypi/*

  installed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel, ubuntu-24.04]
        python: ["3.12"]
        include:
          - os: windows-2022
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      OPENBROADCAST_REQUIRE_DISPLAY: "1"
      OPENBROADCAST_TEST_NATIVE_TRAY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2 libsndfile1 xvfb trayer dbus-x11 libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/pypi
      - run: python -m pip install dist/pypi/*.whl
      - run: python -m pip check
      - name: Verify installed resources, entry points and real CPU inference
        run: |
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/packaging/check_installed.py"
      - name: Test installed package with a real Tk display
        run: |
          cd "$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a dbus-run-session -- python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          else
            python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          fi
